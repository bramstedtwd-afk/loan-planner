<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Loan Payoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-loans" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5M12 8v4l3 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<div class="app">
  <nav class="side glass" aria-label="Main">
    <div class="brand"><span class="logo"><svg class="i" style="width:18px;height:18px"><use href="#i-plan"/></svg></span>Loan Payoff</div>
    <a class="nav" href="#today"><svg class="i"><use href="#i-home"/></svg>Today</a>
    <a class="nav" href="#plan"><svg class="i"><use href="#i-plan"/></svg>Plan</a>
    <a class="nav" href="#money"><svg class="i"><use href="#i-money"/></svg>Money</a>
    <a class="nav" href="#loans"><svg class="i"><use href="#i-loans"/></svg>Loans</a>
    <a class="nav" href="#history"><svg class="i"><use href="#i-history"/></svg>History</a>
    <div class="grow"></div>
    <span class="sync" data-sync><span class="dot"></span><span data-sync-text>Loading…</span></span>
  </nav>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar glass" aria-label="Main">
    <a href="#today"><svg class="i"><use href="#i-home"/></svg>Today</a>
    <a href="#plan"><svg class="i"><use href="#i-plan"/></svg>Plan</a>
    <button class="fab" type="button" aria-label="Quick add" data-quick><svg class="i"><use href="#i-plus"/></svg></button>
    <a href="#money"><svg class="i"><use href="#i-money"/></svg>Money</a>
    <a href="#loans"><svg class="i"><use href="#i-loans"/></svg>Loans</a>
  </nav>
</div>

<div class="toast glass" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
